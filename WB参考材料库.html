<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WB 共创营 · 参考材料库</title>
<style>
  :root {
    --brand: #2F5D8A;
    --brand-dark: #1C3552;
    --brand-light: #EAF1FA;
    --rose: #C97B63;
    --rose-light: #FAEEE9;
    --gold: #B78A2A;
    --gold-light: #FAF3E3;
    --slate: #5E6D83;
    --slate-light: #EEF1F5;
    --slate: #66758A;
    --slate-light: #EEF1F5;
    --neutral-900: #0F1A2E;
    --neutral-700: #374151;
    --neutral-500: #6B7280;
    --neutral-300: #D1D5DB;
    --neutral-200: #E5E7EB;
    --neutral-50: #F9FAFB;
    --white: #FFFFFF;
    --shadow-sm: 0 8px 20px rgba(15,26,46,.06);
    --shadow-md: 0 18px 42px rgba(15,26,46,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background:
      radial-gradient(circle at top right, rgba(47,93,138,.14), transparent 24%),
      radial-gradient(circle at top left, rgba(201,123,99,.10), transparent 20%),
      linear-gradient(180deg, #FAF8F5 0%, #F9FAFB 240px, #F9FAFB 100%);
    color: var(--neutral-700);
  }
  .container {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding-bottom: 72px;
  }
  .hero {
    margin-top: 26px;
    margin-bottom: 18px;
    padding: 40px 34px 32px;
    border-radius: 0 0 28px 28px;
    color: #fff;
    background: linear-gradient(135deg, #1C3552 0%, #2F5D8A 54%, #567EAA 100%);
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -72px;
    top: -72px;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 12px;
    letter-spacing: .4px;
    border: 1px solid rgba(255,255,255,.24);
    background: rgba(255,255,255,.14);
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.2;
    margin-bottom: 12px;
    font-weight: 800;
  }
  .hero p {
    max-width: 760px;
    color: rgba(255,255,255,.84);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 22px;
  }
  .hero-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .hero-chip {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    border: 1px solid rgba(255,255,255,.20);
    background: rgba(255,255,255,.12);
  }
  .overview {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-top: -12px;
  }
  .metric {
    background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(250,252,255,.96));
    border: 1px solid rgba(229,231,235,.85);
    border-radius: 18px;
    box-shadow: var(--shadow-sm);
    padding: 20px 22px;
  }
  .metric-label {
    display: block;
    font-size: 12px;
    color: var(--neutral-500);
    margin-bottom: 6px;
  }
  .metric-value {
    font-size: 28px;
    line-height: 1;
    color: var(--neutral-900);
    font-weight: 800;
  }
  .metric-note {
    font-size: 12px;
    color: var(--neutral-500);
    margin-top: 8px;
  }
  .toolbar {
    margin-top: 26px;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(229,231,235,.9);
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    padding: 22px 22px 18px;
  }
  .toolbar-top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .toolbar h2 {
    color: var(--neutral-900);
    font-size: 18px;
    margin-bottom: 4px;
  }
  .toolbar p, .toolbar-meta {
    font-size: 13px;
    color: var(--neutral-500);
    line-height: 1.6;
  }
  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .filter-chip {
    border: 1px solid rgba(209,213,219,.9);
    background: rgba(249,250,251,.92);
    color: var(--neutral-700);
    border-radius: 999px;
    padding: 10px 15px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: all .18s ease;
  }
  .filter-chip:hover {
    border-color: var(--brand);
    color: var(--brand);
    transform: translateY(-1px);
  }
  .filter-chip.active {
    background: linear-gradient(180deg, #F4F7FB 0%, #EAF1FA 100%);
    border-color: var(--brand);
    color: var(--brand-dark);
    font-weight: 700;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 18px;
  }
  .card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,255,.98));
    border: 1px solid rgba(229,231,235,.92);
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    padding: 22px 22px 20px;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, var(--rose) 0%, #E0A086 100%);
  }
  .card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-3px);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    border-color: rgba(26,84,214,.18);
  }
  .card-top {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--rose-light);
    font-size: 20px;
  }
  .card-head { flex: 1; }
  .card-kicker {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(15,26,46,.05);
    color: var(--neutral-500);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .3px;
    margin-bottom: 8px;
  }
  .card-title {
    font-size: 18px;
    line-height: 1.35;
    color: var(--neutral-900);
    font-weight: 800;
    margin-bottom: 10px;
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
  }
  .tag-blue { background: linear-gradient(180deg, #F4F7FB 0%, #EAF1FA 100%); color: var(--brand-dark); }
  .tag-green { background: linear-gradient(180deg, #F3F5F8 0%, #EEF1F5 100%); color: var(--slate); }
  .summary-panel {
    background: linear-gradient(180deg, rgba(250,243,227,.82), rgba(249,250,251,.88));
    border: 1px solid rgba(229,231,235,.92);
    border-radius: 16px;
    padding: 14px 15px;
  }
  .summary {
    color: var(--neutral-700);
    font-size: 14px;
    line-height: 1.65;
  }
  .cta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
    border-top: 1px solid rgba(229,231,235,.9);
  }
  .footnote {
    font-size: 12px;
    color: var(--neutral-500);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 120px;
    border-radius: 999px;
    padding: 10px 18px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--brand);
    background: linear-gradient(135deg, #2F5D8A 0%, #567EAA 100%);
    color: #fff;
    box-shadow: 0 8px 18px rgba(47,93,138,.20);
  }
  .empty {
    display: none;
    margin-top: 18px;
    padding: 32px 28px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(249,250,251,.96));
    border: 1px dashed var(--neutral-300);
    color: var(--neutral-500);
    text-align: center;
  }
  .footer {
    text-align: center;
    margin-top: 28px;
    color: #9CA3AF;
    font-size: 12px;
  }
  @media (max-width: 960px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .container { width: min(100% - 24px, 1120px); }
    .hero { padding: 34px 20px 26px; }
    .overview { grid-template-columns: 1fr; }
    .toolbar-top { flex-direction: column; }
    .cta-row { flex-direction: column; align-items: flex-start; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <div class="eyebrow">TENCENT CLOUD × WORKBUDDY</div>
    <h1>参考材料库</h1>
    <p>面向不同岗位、职能与场景整理的WorkBuddy宣导、培训与延伸参考材料。可按标签快速筛选，统一查看标题、简介与对应入口。</p>
    <div class="hero-chips" id="hero-chips"></div>
  </section>

  <section class="overview" id="overview"></section>

  <section class="toolbar">
    <div class="toolbar-top">
      <div>
        <h2>按标签筛选</h2>
        <p>按当前标签快速查看适合的培训与参考材料，后续新增岗位或场景内容时可直接沿用这套结构。</p>
      </div>
      <div class="toolbar-meta" id="toolbar-meta"></div>
    </div>
    <div class="filter-group" id="filters"></div>
  </section>

  <section class="grid" id="materials-grid"></section>
  <section class="empty" id="empty-state">当前筛选条件下还没有可展示的参考材料。</section>

  <div class="footer">腾讯云文化传媒行业线 × WorkBuddy · 2026</div>
</div>

<script src="data/reference-materials-data.js"></script>
<script>
  const data = window.REFERENCE_MATERIALS_DATA || { meta: {}, items: [] };
  const state = { activeRole: "全部" };

  const heroChips = document.getElementById("hero-chips");
  const overview = document.getElementById("overview");
  const filters = document.getElementById("filters");
  const grid = document.getElementById("materials-grid");
  const emptyState = document.getElementById("empty-state");
  const toolbarMeta = document.getElementById("toolbar-meta");

  function makeChip(text) {
    const chip = document.createElement("span");
    chip.className = "hero-chip";
    chip.textContent = text;
    return chip;
  }

  function renderHero() {
    const chips = [
      `${data.meta.totalMaterials || 0} 份材料`,
      `${(data.meta.roles || []).length} 类岗位`
    ];
    chips.forEach((item) => heroChips.appendChild(makeChip(item)));
  }

  function metric(label, value, note) {
    return `
      <div class="metric">
        <span class="metric-label">${label}</span>
        <div class="metric-value">${value}</div>
        <div class="metric-note">${note}</div>
      </div>
    `;
  }

  function renderOverview() {
    overview.innerHTML = [
      metric("材料总数", data.meta.totalMaterials || 0, "可直接查看的岗位参考材料"),
      metric("岗位标签", (data.meta.roles || []).length, "按岗位快速筛选与查看")
    ].join("");
  }

  function renderFilters() {
    const roles = ["全部", ...(data.meta.roles || [])];
    filters.innerHTML = "";
    roles.forEach((role) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "filter-chip" + (state.activeRole === role ? " active" : "");
      const count = role === "全部"
        ? data.items.length
        : data.items.filter((item) => item.role === role).length;
      button.textContent = `${role} · ${count}`;
      button.addEventListener("click", () => {
        state.activeRole = role;
        renderFilters();
        renderGrid();
      });
      filters.appendChild(button);
    });
  }

  function tag(text, className) {
    return `<span class="tag ${className}">${text}</span>`;
  }

  function sourceFootnote(item) {
    if (item.source === "腾讯内部") return "适合作为内部宣导后的延伸阅读或体验入口";
    if (item.source === "Workbuddy") return "适合作为对外介绍 WorkBuddy 场景价值的参考材料";
    return "适合作为岗位宣导与培训中的补充参考";
  }

  function renderCard(item) {
    return `
      <article class="card">
        <div class="card-top">
          <div class="card-icon">📚</div>
          <div class="card-head">
            <h3 class="card-title">${item.title}</h3>
            <div class="tag-row">
              ${tag(item.role, "tag-blue")}
              ${tag(item.source || "参考材料", "tag-green")}
            </div>
          </div>
        </div>
        <div class="summary-panel">
          <p class="summary">${item.summary}</p>
        </div>
        <div class="cta-row">
          <div class="footnote">${sourceFootnote(item)}</div>
          <a class="btn" href="${item.linkUrl}" target="_blank" rel="noopener noreferrer">查看材料</a>
        </div>
      </article>
    `;
  }

  function renderGrid() {
    const visibleItems = state.activeRole === "全部"
      ? data.items
      : data.items.filter((item) => item.role === state.activeRole);

    toolbarMeta.textContent = `最近同步：${data.meta.generatedAt || "未标注"} · 当前展示 ${visibleItems.length} 项`;

    if (!visibleItems.length) {
      grid.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }

    emptyState.style.display = "none";
    grid.innerHTML = visibleItems
      .sort((a, b) => a.order - b.order)
      .map(renderCard)
      .join("");
  }

  renderHero();
  renderOverview();
  renderFilters();
  renderGrid();
</script>
</body>
</html>
